# Online ta'lim portali uchun gateway (`onlinetalim.fermi.uz`).
#
# iMentor gateway'ining aynan nusxasi, farqi bitta: statika `frontend`
# dan emas, `frontend_online` dan olinadi. Ikkalasi ALOHIDA konteyner —
# online tomonni yangilash iMentor foydalanuvchilarini uzmaydi.
#
# Bu qatlam SHART: `frontend_online` — oddiy statik server, u `/api/`
# so'rovini backendga uzatmaydi va SPA sahifasini qaytaradi. Ya'ni
# gateway'siz portal API bilan umuman gaplasha olmaydi.

# Docker ichki DNS — scale/restart dan keyin stale IP bo'lmasin
# JSON API javoblari uchun gzip — sillabus katalogi siqilmagan holda ~1.5 MB.
# (backend ham GZipMiddleware bilan siqadi; bu yerdagi sozlama zaxira va
# frontend statikasi uchun.)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

# Javob vaqti ($request_time) yozilmasa, sekinlashuv boshlanganda qaysi
# so'rov sekin ekanini aniqlashning imkoni bo'lmaydi.
log_format online '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent rt=$request_time '
                   'urt="$upstream_response_time" "$http_user_agent"';
access_log /var/log/nginx/access.log online;

resolver 127.0.0.11 valid=10s ipv6=off;

# Host nginx (SSL) dan kelgan proto saqlansin — aks holda Django 301 loop qiladi
map $http_x_forwarded_proto $online_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Tarqatma va taqdimot fayllari uchun. Kitob yuklash bu portalda yo'q,
    # shuning uchun chegara iMentor'dagidan past.
    client_max_body_size 200m;
    client_body_timeout 300s;

    location /api/ {
        set $backend_upstream backend_fastapi:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $online_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        # AI matnini jonli oqim (SSE) sifatida uzatish — nginx bufferlamasin.
        proxy_buffering off;
        proxy_cache off;
    }

    # Fayllarni nginx o'zi beradi. Ilgari ular backend orqali o'tardi va
    # 1 GB lik kitobni yuklab olish butun davomida bitta Python oqimini band
    # qilardi — bir necha o'nlab talaba kitob ochsa, oqimlar tugab API to'xtardi.
    # Volume backend bilan bir xil (media_data), faqat o'qish uchun ulangan.
    location /media/ {
        alias /var/www/media/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "private, max-age=3600" always;
        access_log off;
    }

    location / {
        set $frontend_upstream frontend_online:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $online_forwarded_proto;
    }
}
